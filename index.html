<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物品返却カメラ | 沼津高専</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default"> <meta name="apple-mobile-web-app-title" content="備品返却">
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { 
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif; 
            text-align: center; 
            background: #f4f7f6; /* 明るい薄いグレー（目に優しい！） */
            color: #333; /* 文字は濃いグレーで読みやすく */
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wrapper { 
            width: 95%; /* iPadに合わせて少し広めに */
            max-width: 700px; 
            background: white; /* 清潔感のある白背景 */
            padding: 40px; 
            border-radius: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); /* ほんのり影をつけて立体感を */
        }
        
        /* カメラ映像を主役に！ */
        video { 
            width: 100%; 
            border-radius: 25px; 
            background: #eee; /* カメラ起動前は薄いグレー */
            border: 4px solid #fff; /* 白い枠線 */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1); /* 内側に影を入れて凹凸を表現 */
        }
        #canvas { display: none; }
        
        /* ボタンを大きく、押しやすく！ */
        #return-btn { 
            display: none; 
            width: 100%; 
            padding: 30px; 
            font-size: 2.2rem; 
            margin-top: 30px;
            color: white; 
            background: #2ecc71; /* 爽やかな緑で「完了」のイメージ */
            border: none; 
            border-radius: 25px; 
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.3);
            transition: all 0.2s ease; /* タップ時に少し動かす演出用 */
        }
        #return-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(46, 204, 113, 0.3);
        }

        #status { 
            margin-top: 25px; 
            font-size: 1.6rem; 
            font-weight: bold; 
            min-height: 1.5em; 
            color: #555;
            background: #eefaf3; /* ステータスエリアをほんのり緑に */
            padding: 15px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <h1>📦 物品返却スキャン</h1>
    <p>枠内にQRコードを映してください</p>
    
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="status">カメラ起動中...</div>
    
    <button id="return-btn" onclick="confirmReturn()">返却を確定する</button>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const btn = document.getElementById("return-btn");
    let currentId = "";

    // カメラを起動する
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

            if (code && !currentId) {
                // Formsの長いパラメーター（re...=）の後の値を抜き出す
                const match = code.data.match(/[?&]re[a-z0-9]+=([A-Z0-9-]+)/i);
                
                if (match) {
                    currentId = match[1]; // これで VR001 などのIDが取れる！
                    status.innerText = `読み取り成功: ${currentId}`;
                    status.style.color = "#3498db";
                    btn.style.display = "block";
                    if (navigator.vibrate) navigator.vibrate(200);
                } else if (code.data.includes("forms.office.com")) {
                    // URLはFormsだけど、IDが末尾についていない場合
                    status.innerText = "❌ IDが含まれていないQRです";
                    status.style.color = "red";
                }
            }
        }
        if (!currentId) requestAnimationFrame(tick);
    }

    async function confirmReturn() {
        const webhookUrl = "https://default72fe835d5e9545128ae0a7b38af25f.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fc697f8382ea4d48a06ddc3d97863f47/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Gf4y2WX0WdiBcTuGQ9Mo4GrKPAATiC5g4JiSuzn_rks";
        status.innerText = `⏳ ${currentId} を処理中...`;

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id: currentId })
            });

            if (response.ok) {
                status.innerText = `✅ ${currentId} 返却完了！`;
                status.style.color = "#27ae60";
                btn.style.display = "none";
                setTimeout(resetScanner, 3000);
            } else { throw new Error(); }
        } catch (e) {
            status.innerText = "⚠️ エラー。ネットを確認してね";
            status.style.color = "red";
            setTimeout(resetScanner, 3000);
        }
    }

    function resetScanner() {
        currentId = "";
        status.innerText = "スキャン待機中...";
        status.style.color = "black";
        requestAnimationFrame(tick);
    }
</script>

</body>
</html>
